  <style>
    :root {
      --bg-dark: #090d16;
      --bg-panel: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #131d31;
      --border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --kinfolk: #f59e0b;
      --emerald: #34d399;
      --amber: #fbbf24;
      --purple: #c084fc;
      --rose: #fb7185;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; padding: 18px; gap: 16px; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
    .logo-box h1 { font-size: 1.35rem; color: var(--accent); display: flex; align-items: center; gap: 8px; font-weight: 800; }
    .logo-box p { font-size: 0.82rem; color: var(--text-muted); margin-top: 2px; }
    .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    
    .btn-install { background: linear-gradient(135deg, #0ea5e9, #38bdf8); color: #080c14; border: none; border-radius: 8px; padding: 7px 13px; font-size: 0.8rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 8px rgba(56, 189, 248, 0.35); transition: all 0.2s; }
    .btn-install:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(56, 189, 248, 0.5); }
    
    .badge { font-size: 0.72rem; font-weight: 800; padding: 4px 9px; border-radius: 6px; letter-spacing: 0.3px; }
    .badge-lighting { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-kinfolk { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }

    .main-grid { display: grid; grid-template-columns: 460px 1fr; gap: 20px; flex: 1; align-items: start; }

    /* Left Builder */
    .builder-panel { background-color: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .panel-header { display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--accent); padding-left: 10px; }
    .panel-header h2 { font-size: 1.05rem; color: var(--text); font-weight: 700; }
    .btn-reset { background: #1e293b; color: #cbd5e1; border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px; font-size: 0.78rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .btn-reset:hover { background: #334155; color: #fff; border-color: #94a3b8; }

    .form-row { display: flex; flex-direction: column; gap: 5px; }
    .form-row label { font-size: 0.78rem; font-weight: 700; color: #cbd5e1; }
    .form-row select, .form-row textarea, .form-row input { background-color: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 8px 10px; font-size: 0.83rem; outline: none; transition: border-color 0.2s; }
    .form-row select:focus, .form-row textarea:focus, .form-row input:focus { border-color: var(--accent); }
    .form-row select optgroup { background-color: #0f172a; color: #38bdf8; font-weight: 800; font-size: 0.82rem; }
    .form-row select option { background-color: #131d31; color: #f8fafc; font-weight: 400; }
    .form-row textarea { resize: vertical; min-height: 55px; line-height: 1.4; }

    .live-box-wrap { display: flex; flex-direction: column; gap: 6px; }
    .live-box-header { display: flex; justify-content: space-between; align-items: center; }
    .live-box-header span { font-size: 0.78rem; font-weight: 700; color: #38bdf8; }
    .live-box { background-color: #050811; border: 1px solid #38bdf8; border-radius: 8px; padding: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.82rem; line-height: 1.48; color: #f1f5f9; min-height: 90px; max-height: 180px; overflow-y: auto; word-break: break-all; white-space: pre-wrap; }
    .btn-copy-main { background-color: var(--accent); color: #080c14; font-weight: 800; font-size: 0.92rem; border: none; border-radius: 8px; padding: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; width: 100%; }
    .btn-copy-main:hover { background-color: var(--accent-hover); }

    /* Right Library */
    .library-panel { display: flex; flex-direction: column; gap: 14px; }
    .filter-bar { display: flex; justify-content: space-between; align-items: center; background-color: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; flex-wrap: wrap; gap: 10px; }
    .tab-group { display: flex; gap: 7px; flex-wrap: wrap; }
    .tab-btn { background-color: var(--bg-input); border: 1px solid var(--border); color: var(--text-muted); padding: 6px 13px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active, .tab-btn:hover { background-color: var(--accent); color: #080c14; border-color: var(--accent); }
    .tab-btn[data-cat="kinfolk"].active { background-color: #f59e0b; color: #080c14; border-color: #f59e0b; }
    .search-input { width: 220px; padding: 6px 12px; font-size: 0.82rem; }

    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }
    .card { background-color: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; transition: border-color 0.2s, transform 0.2s; }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card.kinfolk-card { border-color: rgba(245, 158, 11, 0.35); background: linear-gradient(180deg, #131d33 0%, #0f172a 100%); }
    .card.kinfolk-card:hover { border-color: #f59e0b; }

    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-title { font-size: 0.92rem; font-weight: 700; color: var(--text); line-height: 1.35; }
    .tag { font-size: 0.7rem; font-weight: 800; padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
    .tag-kinfolk { background-color: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .tag-nature { background-color: rgba(52, 211, 153, 0.18); color: var(--emerald); }
    .tag-atelier { background-color: rgba(251, 191, 36, 0.18); color: var(--amber); }
    .tag-vintage { background-color: rgba(192, 132, 252, 0.18); color: var(--purple); }
    .tag-season { background-color: rgba(251, 113, 133, 0.18); color: var(--rose); }
    
    .card-meta { font-size: 0.78rem; color: #38bdf8; font-family: ui-monospace, monospace; line-height: 1.4; background: rgba(56, 189, 248, 0.08); padding: 5px 8px; border-radius: 4px; }
    .card.kinfolk-card .card-meta { color: #fbbf24; background: rgba(245, 158, 11, 0.1); }
    .card-desc { font-size: 0.82rem; color: var(--text-muted); line-height: 1.45; }
    .card-code { background-color: #050811; border: 1px solid #1e293b; border-radius: 6px; padding: 10px; font-family: ui-monospace, monospace; font-size: 0.77rem; color: #cbd5e1; line-height: 1.42; max-height: 95px; overflow-y: auto; white-space: pre-wrap; }
    .card-btns { display: flex; justify-content: flex-end; gap: 6px; }
    .btn-sm { padding: 6px 11px; font-size: 0.76rem; border-radius: 5px; font-weight: 700; cursor: pointer; border: none; transition: background 0.2s; }
    .btn-load { background-color: #1e293b; color: #e2e8f0; border: 1px solid #475569; }
    .btn-load:hover { background-color: #334155; color: #fff; }
    .btn-copy { background-color: var(--accent); color: #080c14; }
    .btn-copy:hover { background-color: var(--accent-hover); }
    .card.kinfolk-card .btn-copy { background-color: #f59e0b; color: #080c14; }
    .card.kinfolk-card .btn-copy:hover { background-color: #d97706; }

    /* Toast */
    #toast { position: fixed; bottom: 24px; right: 24px; background-color: #22c55e; color: #080c14; font-weight: 800; padding: 11px 18px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); opacity: 0; transform: translateY(10px); transition: all 0.3s; z-index: 3000; pointer-events: none; max-width: 90vw; }
    #toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 1024px) {
      .main-grid { grid-template-columns: 1fr; }
      .builder-panel { position: static; max-height: none; }
      .search-input { width: 100%; }
      .btn-install { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-box">
      <h1>📸 AI 감성 사진 스튜디오 <span style="font-size:0.78rem; background:#1e293b; color:#94a3b8; padding:3px 8px; border-radius:5px; border:1px solid #334155;">v5.1</span></h1>
      <p>스튜디오 24대 조명 가이드 + 킨포크 에디션 10선 + 감성 마스터 화보 78선 라이브러리</p>
    </div>
    <div class="header-actions">
      <button class="btn-install" id="btn-install" type="button">📲 홈 화면/바탕화면에 추가</button>
      <span class="badge badge-lighting">💡 스튜디오 24대 조명</span>
      <span class="badge badge-kinfolk">🌿 킨포크 10선</span>
    </div>
  </header>

  <div class="main-grid">
    <!-- Left: Interactive Builder -->
    <aside class="builder-panel">
      <div class="panel-header">
        <h2>🛠️ 프롬프트 콤보 빌더</h2>
        <button class="btn-reset" id="btn-reset" type="button">🔄 초기화</button>
      </div>

      <div class="form-row">
        <label for="sel-mode">1. 프롬프트 모드</label>
        <select id="sel-mode">
          <option value="Kinfolk magazine editorial photograph characterized by Scandinavian minimalism, muted earthy palette, unhurried domestic stillness.">🌿 킨포크 신규 생성 모드 (Kinfolk Text-to-Image)</option>
          <option value="Preserve the exact identity, facial features, pose, and core structure of the subject in the uploaded reference photo.">📸 내 촬영 사진 보존 변형 모드 (Img2Img)</option>
          <option value="">-- [모드 선택 안 함] --</option>
        </select>
      </div>

      <div class="form-row">
        <label for="sel-env">2. 공간 및 배경</label>
        <select id="sel-env">
          <option value="">-- [선택 안 함] --</option>
          <option value="in a minimalist architectural space with smooth sandstone plaster walls and geometric terracotta steps, generous negative space">킨포크 건축: 샌드스톤 회벽과 테라코타 계단</option>
          <option value="at a rustic dining table draped in a wrinkled, raw ivory linen tablecloth with handmade ceramic cup and rising steam">킨포크 테이블: 린넨 식탁보와 유약 없는 수제 세라믹</option>
          <option value="in a quiet minimalist Copenhagen apartment with pale oiled oak floors and arched French window pouring soft daylight">킨포크 인테리어: 코펜하겐 아파트와 높은 아치창</option>
          <option value="amidst lush, sculpted mounds of green velvety topiary hedges under soft overcast diffused daylight">킨포크 정원: 조각 같은 초록 토피어리 관목원</option>
          <option value="on an empty Pacific Northwest beach sitting calmly beside a massive pale driftwood log with misty horizon">킨포크 해변: 광활한 해무와 거대한 유목 통나무</option>
          <option value="on a vast, mirror-like wet tidal sand flat at sunset reflecting the glowing twilight sky">대자연 해변: 황혼의 해안 모래톱과 젖은 모래 반영</option>
          <option value="in an untouched primeval moss forest surrounded by damp emerald-green mossy rocks and ancient tree roots">대자연 숲: 원시 이끼 숲과 천상의 틴들 빛내림</option>
          <option value="on a rugged basalt sea cliff edge facing violent ocean waves and sea mist with no human structures">대자연 절벽: 대양의 현무암 바위 절벽과 파도 비말</option>
          <option value="at the edge of a crystal-clear mountain glacial brook with smooth river pebbles and alpine air">대자연 계곡: 고산 빙하 개울과 서늘한 산악 대기</option>
          <option value="on a vast rolling hillside filled with ancient gnarled olive trees under crisp Mediterranean sky">대자연 언덕: 지중해 야생 올리브 언덕</option>
          <option value="inside a narrow red sandstone slot canyon with flowing sculpted walls and swirling dust motes">대자연 협곡: 붉은 사암 협곡과 슬롯 광선</option>
        </select>
      </div>

      <div class="form-row">
        <label for="sel-lighting">3. 조명 및 스튜디오 라이팅 세팅 (Studio & Natural)</label>
        <select id="sel-lighting">
<option value="">-- [선택 안 함] --</option>
          <optgroup label="📸 프로 스튜디오 24대 조명 세팅 (Studio Master Guide)">
            <option value="Rembrandt lighting setup using a 20-inch key softbox positioned high and 45 degrees to the side, creating a defined triangle of light on the shadow cheek with directional soft contrast">렘브란트 (소프트박스) - Rembrandt with a Softbox</option>
            <option value="Rembrandt lighting setup through a white shoot-through umbrella positioned high at 45 degrees, producing soft wrap-around contrast with subtle triangle highlight on cheek">렘브란트 (투과 우산) - Rembrandt through a Brolly</option>
            <option value="Dramatic low-key Rembrandt lighting using a key strobe with honeycomb grid attachment, creating a focused beam of light with deep chiaroscuro shadows and narrow triangle cheek highlight">렘브란트 (허니컴 그리드) - Rembrandt with a Honeycomb</option>
            <option value="Punchy Rembrandt lighting using a silver reflective umbrella, delivering crisp specular highlights, vibrant microcontrast, and classic cheek triangle shadow">렘브란트 (실버 반사 우산) - Rembrandt with a Silver Brolly</option>
            <option value="Rembrandt short lighting setup illuminating the side of the face turned away from camera, narrowing facial structure with expressive deep dimensional shadows">렘브란트 쇼트 라이팅 - Rembrandt Short Lighting</option>
            <option value="Rembrandt broad lighting setup illuminating the side of the face turned toward camera, creating an open, luminous portrait with soft cheek triangle on shadow side">렘브란트 브로드 라이팅 - Rembrandt Broad Lighting</option>
            <option value="Dramatic split lighting setup with a single strobe placed 90 degrees to the side, dividing the face precisely into half brilliant light and half deep shadow">스플릿 라이팅 (사이드 1등) - Split Lighting</option>

    "desc": "가을빛이 서늘하게 내려앉은 고산 지대 빙하 개울가. 피사체의 시선과 긴장된 포즈를 유지한 채, 바닥이 훤히 들여다보이는 차가운 시냇물과 둥근 흑요석 조약돌을 배치한다. 오후 4시의 서늘한 5000K 가을 햇살이 개울물에 반사되며 반짝이는 수면 보케를 만들고 피사체의 근육과 윤곽선을 따라 실버 골드 림라이트를 완성한다.",
    "prompt": "Preserve the exact identity, facial features, pose, and core structure of the subject in the uploaded reference photo. Transform the entire environment, lighting, and mood into an ultra-photorealistic alpine wilderness editorial at the edge of a crystal-clear mountain glacial brook with no human structures. Smooth river pebbles and floating autumn leaves in clear water. Slanted 5000K crisp autumn mountain backlight bouncing off the flowing stream, creating a radiant silvery rim light along the subject's contours and sparkling water bokeh. Shot on Fujifilm X-T5, XF 56mm F1.2 at f/2.0, ISO 160, Classic Chrome, 5000K, 3:4 aspect ratio, tactile pebble textures, pure wilderness mood.",
    "spec": "Camera: Fujifilm X-T5 | Lens: XF 56mm F1.2 R WR | Settings: f/2.0, ISO 160, 1/500s | Film Simulation: Classic Chrome | Lighting: Slanted autumn mountain backlight with stream reflections | Color Temp: 5000K | Aspect Ratio: 3:4"
  }
];

    let currentCat = "all";
    let searchQuery = "";
    let deferredPrompt = null;

    const grid = document.getElementById("cards-container");
    const tabs = document.getElementById("filter-tabs");
    const search = document.getElementById("search-input");
    const toast = document.getElementById("toast");

    const selMode = document.getElementById("sel-mode");
    const selEnv = document.getElementById("sel-env");
    const selLighting = document.getElementById("sel-lighting");
    const selCamera = document.getElementById("sel-camera");
    const selLens = document.getElementById("sel-lens");
    const selFilm = document.getElementById("sel-film");
    const selRatio = document.getElementById("sel-ratio");
    const inpDesc = document.getElementById("inp-desc");
    const liveOutput = document.getElementById("live-output");
    const btnCopy = document.getElementById("btn-copy-builder");
    const btnReset = document.getElementById("btn-reset");
    const btnInstall = document.getElementById("btn-install");

    // PWA BeforeInstallPrompt Event Listener
    window.addEventListener("beforeinstallprompt", (e) => {{
      e.preventDefault();
      deferredPrompt = e;
      if (btnInstall) {{
        btnInstall.style.display = "flex";
      }}
    }});

    window.addEventListener("appinstalled", () => {{
      deferredPrompt = null;
      showToast("앱이 바탕화면에 성공적으로 추가되었습니다! 🎉");
    }});

    // Install Button Handler
    if (btnInstall) {{
      btnInstall.addEventListener("click", async () => {{
        if (deferredPrompt) {{
          deferredPrompt.prompt();
          const choiceResult = await deferredPrompt.userChoice;
          if (choiceResult.outcome === "accepted") {{
            showToast("홈 화면/바탕화면에 추가되었습니다!");
          }} else {{
            showToast("추가가 취소되었습니다.");
          }}
          deferredPrompt = null;
        }} else {{
          // Check iOS vs Android / Desktop
          const userAgent = window.navigator.userAgent.toLowerCase();
          const isIOS = /iphone|ipad|ipod/.test(userAgent);
          if (isIOS) {{
            showToast("사파리 하단 [공유] 버튼(네모+화살표)을 누르고 '홈 화면에 추가'를 선택하세요! 📲");
          }} else {{
            showToast("브라우저 메뉴(⋮)에서 '홈 화면에 추가' 또는 '앱 설치'를 누르면 바탕화면에 생성됩니다! 📲");
          }}
        }}
      }});
    }}

    let toastTimer = null;
    function showToast(msg = "클립보드에 복사되었습니다!") {{
      if (toastTimer) clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.classList.add("show");
      toastTimer = setTimeout(() => {{
        toast.classList.remove("show");
      }}, 3200);
    }}

    function copyText(text) {{
      if (!text || text.trim() === "") {{
        showToast("복사할 내용이 없습니다.");
        return;
      }}
      if (navigator.clipboard && window.isSecureContext) {{
        navigator.clipboard.writeText(text).then(() => showToast()).catch(() => fallbackCopy(text));
      }} else {{
        fallbackCopy(text);
      }}
    }}

    function fallbackCopy(text) {{
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {{
        document.execCommand("copy");
        showToast();
      }} catch (err) {{
        showToast("복사에 실패했습니다.");
      }}
      document.body.removeChild(ta);
    }}

    function updateLivePreview() {{
      const parts = [];
      const mode = selMode.value;
      const env = selEnv.value;
      const desc = inpDesc.value.trim();

      if (mode) {{
        if (env) {{
          parts.push(mode + " " + env);
        }} else {{
          parts.push(mode);
        }}
      }} else if (env) {{
        parts.push(env);
      }}

      if (desc) parts.push(desc);
      if (selLighting.value) parts.push(selLighting.value);
      if (selCamera.value) parts.push(selCamera.value);
      if (selLens.value) parts.push(selLens.value);
      if (selFilm.value) parts.push(selFilm.value);
      if (selRatio.value) parts.push(selRatio.value);

      if (parts.length === 0) {{
        liveOutput.textContent = "선택된 옵션이 없습니다.";
      }} else {{
        const assembled = parts.map(p => p.endsWith(".") ? p : p + ".").join(" ");
        liveOutput.textContent = assembled;
      }}
    }}

    function renderCards() {{
      grid.innerHTML = "";
      const filtered = masterCollection.filter(item => {{
        const matchesCat = (currentCat === "all" || item.category === currentCat);
        const q = searchQuery.toLowerCase();
        const matchesSearch = !q ||
                              item.title.toLowerCase().includes(q) ||
                              item.desc.toLowerCase().includes(q) ||
                              item.spec.toLowerCase().includes(q) ||
                              item.prompt.toLowerCase().includes(q);
        return matchesCat && matchesSearch;
      }});

      if (filtered.length === 0) {{
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:60px; color:var(--text-muted);">일치하는 프롬프트가 없습니다.</div>`;
        return;
      }}

      const fragment = document.createDocumentFragment();

      filtered.forEach(item => {{
        const card = document.createElement("div");
        card.className = "card" + (item.category === "kinfolk" ? " kinfolk-card" : "");

        const headDiv = document.createElement("div");
        headDiv.innerHTML = `
          <div class="card-head">
            <span class="card-title">${item.title}</span>
            <span class="tag ${item.catClass}">${item.catName}</span>
          </div>
          <p class="card-desc" style="margin-top:6px;">${item.desc}</p>
        `;
        card.appendChild(headDiv);

        const metaDiv = document.createElement("div");
        metaDiv.className = "card-meta";
        metaDiv.textContent = item.spec;
        card.appendChild(metaDiv);

        const codeDiv = document.createElement("div");
        codeDiv.className = "card-code";
        codeDiv.textContent = item.prompt;
        card.appendChild(codeDiv);

        const btnsDiv = document.createElement("div");
        btnsDiv.className = "card-btns";

        const btnLoad = document.createElement("button");
        btnLoad.className = "btn-sm btn-load";
        btnLoad.type = "button";
        btnLoad.textContent = "➕ 빌더에 추가";
        btnLoad.dataset.action = "load";
        btnLoad.dataset.id = item.id;
        btnsDiv.appendChild(btnLoad);

        const btnCardCopy = document.createElement("button");
        btnCardCopy.className = "btn-sm btn-copy";
        btnCardCopy.type = "button";
        btnCardCopy.textContent = "📋 프롬프트 복사";
        btnCardCopy.dataset.action = "copy";
        btnCardCopy.dataset.id = item.id;
        btnsDiv.appendChild(btnCardCopy);

        card.appendChild(btnsDiv);
        fragment.appendChild(card);
      }});

      grid.appendChild(fragment);
    }}

    grid.addEventListener("click", (e) => {{
      const btn = e.target.closest("button");
      if (!btn) return;
      const action = btn.dataset.action;
      const id = btn.dataset.id;
      if (!id) return;

      const item = masterCollection.find(x => x.id === id);
      if (!item) return;

      if (action === "copy") {{
        copyText(item.prompt);
      }} else if (action === "load") {{
        if (inpDesc.value.trim()) {{
          inpDesc.value += ` ${item.prompt}`;
        }} else {{
          inpDesc.value = item.prompt;
        }}
        updateLivePreview();
        showToast("빌더에 추가되었습니다!");
      }}
    }});

    [selMode, selEnv, selLighting, selCamera, selLens, selFilm, selRatio, inpDesc].forEach(el => {{
      el.addEventListener("input", updateLivePreview);
      el.addEventListener("change", updateLivePreview);
    }});

    btnCopy.addEventListener("click", () => {{
      const txt = liveOutput.textContent;
      if (!txt || txt === "선택된 옵션이 없습니다.") {{
        showToast("복사할 프롬프트 내용이 없습니다.");
        return;
      }}
      copyText(txt);
    }});

    btnReset.addEventListener("click", () => {{
      selMode.selectedIndex = 0;
      selMode.value = selMode.options[0].value;
      selEnv.selectedIndex = 0;
      selEnv.value = "";
      selLighting.selectedIndex = 0;
      selLighting.value = "";
      selCamera.selectedIndex = 0;
      selCamera.value = "";
      selLens.selectedIndex = 0;
      selLens.value = "";
      selFilm.selectedIndex = 0;
      selFilm.value = "";
      selRatio.selectedIndex = 0;
      selRatio.value = "";
      inpDesc.value = "";
      updateLivePreview();
      showToast("모든 항목이 제로(0)로 초기화되었습니다.");
    }});

    tabs.addEventListener("click", (e) => {{
      const btn = e.target.closest(".tab-btn");
      if (!btn) return;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentCat = btn.dataset.cat;
      renderCards();
    }});

    search.addEventListener("input", (e) => {{
      searchQuery = e.target.value.trim();
      renderCards();
    }});

    // Initialize
    updateLivePreview();
    renderCards();
  </script>
</body>
</html>
